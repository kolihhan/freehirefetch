name: Browserless ATS Job Discovery

on:
  schedule:
    # UTC, four-hour cadence offset from FreeHire's existing hourly ingestion.
    - cron: '37 1,5,9,13,17,21 * * *'
  workflow_dispatch:
  push:
    paths:
      - ats_discovery.py
      - ats_boards.json
      - test_ats_discovery.py
      - .github/workflows/ats-discovery.yml

permissions:
  contents: write

# New code/config pushes supersede stale checkout runs; scheduled data refreshes remain serialized.
concurrency:
  group: ats-discovery
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests (record failure evidence)
        id: tests
        shell: bash
        run: |
          mkdir -p feed/ats
          set +e
          python -m unittest -v test_ats_discovery > /tmp/ats-tests.txt 2>&1
          code=$?
          cat /tmp/ats-tests.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          export TEST_EXIT=$code
          python - <<'PY'
          import json, os
          from pathlib import Path
          log = Path("/tmp/ats-tests.txt").read_text(errors="replace")
          Path("feed/ats/ci-health.json").write_text(json.dumps({
              "tests_exit_code": int(os.environ["TEST_EXIT"]),
              "tests_tail": log[-6000:],
          }, indent=2) + "\n")
          PY
      - name: Fetch exact public ATS board feeds
        id: fetch
        shell: bash
        run: |
          set +e
          if [ "${{ steps.tests.outputs.exit_code }}" != "0" ]; then
            echo "Tests failed: preserving previous ATS feed; see ci-health."
            exit_code=2
          else
            timeout 900s python ats_discovery.py
            exit_code=$?
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit public ATS feed changes only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed/ats
          if git diff --cached --quiet; then
            echo "No new/changed public ATS evidence."
          else
            git commit -m "data: refresh ATS job feed and CI status (public only)"
            git pull --rebase
            git push
          fi
      - name: Fail visibly on tests or incomplete board
        if: steps.tests.outputs.exit_code != '0' || steps.fetch.outputs.exit_code != '0'
        run: |
          echo "::error::ATS tests or at least one board failed. See feed/ats/ci-health.json and feed/ats/health.json."
          exit 1
