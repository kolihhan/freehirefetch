name: ATS Discovery and Application Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ats_discovery.py'
      - 'application_probe.py'
      - 'test_ats_discovery.py'
      - 'market_api_collect.py'
      - 'test_market_api_collect.py'
      - 'sg_research_collect.py'
      - 'test_sg_research_collect.py'
      - 'cn_platform_collect.py'
      - 'test_cn_platform_collect.py'
      - 'ats_boards.json'
      - '.github/workflows/ats-discovery.yml'
  pull_request:
    paths:
      - 'ats_discovery.py'
      - 'application_probe.py'
      - 'test_ats_discovery.py'
      - 'market_api_collect.py'
      - 'test_market_api_collect.py'
      - 'sg_research_collect.py'
      - 'test_sg_research_collect.py'
      - 'cn_platform_collect.py'
      - 'test_cn_platform_collect.py'
      - 'ats_boards.json'
      - '.github/workflows/ats-discovery.yml'
  schedule:
    - cron: '37 1,5,9,13,17,21 * * *'
permissions:
  contents: write

# New code/config pushes supersede stale checkout runs; scheduled data refreshes remain serialized.
concurrency:
  group: ats-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests (record failure evidence)
        id: tests
        shell: bash
        run: |
          mkdir -p feed/ats
          set +e
          python -m unittest -v test_ats_discovery test_market_api_collect test_collect_devglobal_source test_sg_research_collect test_cn_platform_collect > /tmp/ats-tests.txt 2>&1
          code=$?
          cat /tmp/ats-tests.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          export TEST_EXIT=$code
          python - <<'PY'
          import json, os
          from pathlib import Path
          log = Path("/tmp/ats-tests.txt").read_text(errors="replace")
          Path("feed/ats/ci-health.json").write_text(json.dumps({
              "tests_exit_code": int(os.environ["TEST_EXIT"]),
              "tests_tail": log[-6000:],
          }, indent=2) + "\n")
          PY
      - name: Fetch exact public ATS board feeds
        id: fetch
        shell: bash
        run: |
          set +e
          if [ "${{ steps.tests.outputs.exit_code }}" != "0" ]; then
            echo "Tests failed: preserving previous ATS feed; see ci-health."
            exit_code=2
          else
            timeout 900s python ats_discovery.py
            exit_code=$?
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Collect public API discovery batches (source only)
        if: steps.tests.outputs.exit_code == '0'
        shell: bash
        run: |
          python market_api_collect.py --out-dir feed/market-api --max-pages 4 --sg-freehire-pages 6 ||
            echo "::warning::Public API batch providers failed; keep previous candidate snapshots and report outage"
      - name: Collect DevGlobal public supplementary job batches
        if: steps.tests.outputs.exit_code == '0'
        shell: bash
        run: |
          python collect_devglobal_source.py --out-dir feed/devglobal ||
            echo "::warning::DevGlobal public API unavailable; keep earlier source snapshot, report coverage error"
      - name: Collect public SG university and research roles
        if: steps.tests.outputs.exit_code == '0'
        shell: bash
        run: |
          timeout 240s python sg_research_collect.py --output feed/sg-research/current.json ||
            echo "::warning::Public research portal scan incomplete; do not treat as exhausted"
      - name: Read-only browser application evidence (SG/CN/MY)
        id: probe
        if: steps.tests.outputs.exit_code == '0'
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          python application_probe.py --self-test
          timeout 120s python cn_platform_collect.py || echo "::warning::CN native platform source sample incomplete"
          timeout 420s python application_probe.py --limit 150 --workers 10
      - name: Upload fresh collection and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-ats-application-evidence
          path: |
            feed/ats/health.json
            feed/ats/ci-health.json
            feed/ats/changes.json
            feed/ats/application-probes.json
            feed/ats/api-liveness.json
            feed/cn-native/platform-public.json
            feed/market-api/health.json
            feed/sg-research/current.json
          if-no-files-found: warn
      - name: Commit public source feed changes only
        if: github.ref == 'refs/heads/main' && steps.tests.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed/ats feed/market-api feed/devglobal
          if [ -d feed/sg-research ]; then git add -A feed/sg-research; fi
          if [ -f feed/cn-native/platform-public.json ]; then git add feed/cn-native/platform-public.json; fi
          if git diff --cached --quiet; then
            echo "No new/changed public ATS evidence."
          else
            git commit -m "data: refresh ATS job feed and CI status (public only)"
            git pull --rebase origin main
            git push
          fi
      - name: Fail visibly on tests or incomplete board
        if: steps.tests.outputs.exit_code != '0' || steps.fetch.outputs.exit_code != '0' || steps.probe.outcome == 'failure'
        run: |
          echo "::error::ATS tests or at least one board failed. See feed/ats/ci-health.json and feed/ats/health.json."
          exit 1
