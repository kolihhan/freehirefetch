name: Bootstrap FreeHire Pages

on:
  push:
    branches:
      - main
    paths:
      - feed_pages.py

permissions:
  contents: write

concurrency:
  group: freehire-pages-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build paged feed
        run: python feed_pages.py

      - name: Publish paged feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/index.json feed/pages
          if git diff --cached --quiet; then
            echo "Paged feed already current."
            exit 0
          fi
          git commit -m "chore: bootstrap paged FreeHire feed [skip ci]"
          git push
