name: FreeHire Cold Start

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/coldstart.yml'

permissions:
  contents: write

concurrency:
  group: freehire-ingestion
  cancel-in-progress: true

jobs:
  coldstart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run full FreeHire scan
        run: |
          python firehose_fetch.py --mode full
          python feed_pages.py

      - name: Publish cold-start and public state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/events.jsonl feed/index.json feed/pages feed/candidates.json feed/coldstart.json state/seen.json health.json
          if git diff --cached --quiet; then
            echo "No public-state changes."
            exit 0
          fi
          git commit -m "chore: refresh FreeHire cold start [skip ci]"
          git pull --rebase origin main
          git push
