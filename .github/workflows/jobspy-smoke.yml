name: JobSpy SG MY one-off probe

on:
  push:
    branches:
      - spike/jobspy-sg-my-20261121
    paths:
      - .github/workflows/jobspy-smoke.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free JobSpy
        run: python -m pip install --disable-pip-version-check python-jobspy==1.5.0
      - name: Search bounded public SG/MY jobs
        run: timeout 420s python experiments/jobspy_probe.py
      - name: Validate whether actual job records were obtained
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("jobspy-probe-output/report.json").read_text())
          print("STATUS",r["status"],"UNIQUE_IDS",r["market_source_job_ids"])
          if r["status"] != "HAS_ROWS":
              raise SystemExit("No live JobSpy rows; inspect report/errors, not a claim of zero vacancies")
          PY
      - name: Upload raw public smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobspy-sg-my-smoke
          path: jobspy-probe-output/
          if-no-files-found: warn
          retention-days: 7
