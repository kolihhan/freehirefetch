name: JobSpy SG MY one-off probe

on:
  push:
    branches:
      - spike/jobspy-sg-my-20261121
    paths:
      - .github/workflows/jobspy-smoke.yml
      - experiments/jobspy_probe.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/jobspy-smoke.yml
      - experiments/jobspy_probe.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free JobSpy
        run: python -m pip install --disable-pip-version-check python-jobspy==1.5.0
      - name: Search bounded public SG/MY jobs
        run: timeout 600s python experiments/jobspy_probe.py
      - name: Preserve isolated test evidence on this spike branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/jobspy-results-expanded
          if test -f jobspy-probe-output/report.json; then
            cp jobspy-probe-output/report.json experiments/jobspy-results-expanded/report.json
            cp jobspy-probe-output/jobs.csv experiments/jobspy-results-expanded/jobs.csv
          else
            echo '{"status":"NO_REPORT","error":"JobSpy install or execution failed before report was generated"}' > experiments/jobspy-results-expanded/report.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/jobspy-results
          if ! git diff --cached --quiet; then
            git commit -m "test: record one-off public JobSpy result [skip ci]"
            git push origin HEAD:spike/jobspy-sg-my-20261121
          fi
      - name: Upload isolated public test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobspy-sg-my-expanded
          path: jobspy-probe-output/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if no live jobs were observed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("jobspy-probe-output/report.json").read_text())
          print(report["status"], report["market_source_job_ids"])
          if report["status"] != "HAS_ROWS":
              raise SystemExit("No live JobSpy rows: see errors in the report")
          PY
